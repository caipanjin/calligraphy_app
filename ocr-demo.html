<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <title>OCR 对比测试</title>
    <style>
      :root {
        --bg: #f4efe6;
        --surface: #fffdf8;
        --ink: #1f1d1a;
        --ink-2: #57524a;
        --ink-3: #68624f;
        --accent: #b4452f;
        --line: rgba(31, 29, 26, 0.12);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        padding-top: calc(16px + env(safe-area-inset-top));
        font-family: -apple-system, 'PingFang SC', sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
      }
      h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: 0.04em; }
      .hint { margin: 0 0 16px; font-size: 13px; color: var(--ink-3); }
      .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
      button, label.btn {
        flex: 1;
        min-width: 140px;
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 16px;
        border: none;
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink);
        font-size: 14.5px;
        font-family: inherit;
        box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: #fff; }
      button:disabled { opacity: .45; }
      input[type=file] { display: none; }
      #preview { position: relative; margin: 12px 0; border-radius: 14px; overflow: hidden; background: var(--surface); }
      #preview img { display: block; width: 100%; height: auto; }
      #boxes { position: absolute; inset: 0; width: 100%; height: 100%; }
      .card {
        background: var(--surface);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: 0 1px 2px rgba(0,0,0,.06);
      }
      .card h2 { margin: 0 0 8px; font-size: 14px; color: var(--ink-2); display: flex; justify-content: space-between; }
      .card .meta { font-size: 12px; color: var(--ink-3); font-weight: 400; }
      .text { font-size: 17px; letter-spacing: 0.06em; word-break: break-all; min-height: 24px; }
      .status { font-size: 13px; color: var(--ink-3); }
      .status.err { color: var(--accent); }
      code { background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>OCR 对比测试</h1>
    <p class="hint">选一张真实字帖照片，用两种引擎分别识别，比较准确率与耗时。</p>

    <div class="row">
      <label class="btn" for="file">选择 / 拍摄图片</label>
      <input id="file" type="file" accept="image/*" />
    </div>

    <div id="preview" hidden>
      <img id="previewImg" alt="" />
      <canvas id="boxes"></canvas>
    </div>

    <div class="row">
      <button id="runPaddle" class="primary" disabled>PaddleOCR 识别</button>
      <button id="runTess" disabled>Tesseract 识别</button>
    </div>

    <div class="card">
      <h2>PaddleOCR <span class="meta" id="paddleMeta">未运行</span></h2>
      <div class="text" id="paddleText">—</div>
      <div class="status" id="paddleStatus"></div>
    </div>

    <div class="card">
      <h2>Tesseract <span class="meta" id="tessMeta">未运行</span></h2>
      <div class="text" id="tessText">—</div>
      <div class="status" id="tessStatus"></div>
    </div>

    <div class="card">
      <h2>说明</h2>
      <div class="status">
        首次点击 PaddleOCR 需要下载约 20MB 模型（约 10-30 秒），之后会走缓存。<br />
        Tesseract 模型已内置，离线可用。<br />
        识别框画在上方图片上。
      </div>
    </div>

    <script src="/demo/vendor/paddlejs-ocr.js"></script>
    <script type="module">
      import { preprocessImage, recognizeText } from '/src/utils/ocr.js';

      const paddleOcr = window.paddlejs && window.paddlejs.ocr;

      const fileInput = document.getElementById('file');
      const preview = document.getElementById('preview');
      const previewImg = document.getElementById('previewImg');
      const boxes = document.getElementById('boxes');
      const runPaddleBtn = document.getElementById('runPaddle');
      const runTessBtn = document.getElementById('runTess');

      let currentDataUrl = null;

      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          currentDataUrl = reader.result;
          previewImg.src = currentDataUrl;
          preview.hidden = false;
          runPaddleBtn.disabled = false;
          runTessBtn.disabled = false;
          document.getElementById('paddleText').textContent = '—';
          document.getElementById('tessText').textContent = '—';
          document.getElementById('paddleMeta').textContent = '未运行';
          document.getElementById('tessMeta').textContent = '未运行';
          document.getElementById('paddleStatus').textContent = '';
          document.getElementById('tessStatus').textContent = '';
          boxes.getContext('2d').clearRect(0, 0, boxes.width, boxes.height);
        };
        reader.readAsDataURL(file);
      });

      const drawBoxes = (points) => {
        const ctx = boxes.getContext('2d');
        boxes.width = previewImg.naturalWidth;
        boxes.height = previewImg.naturalHeight;
        ctx.clearRect(0, 0, boxes.width, boxes.height);
        ctx.strokeStyle = '#b4452f';
        ctx.lineWidth = Math.max(2, boxes.width / 400);
        (points || []).forEach((box) => {
          if (!box || box.length < 4) return;
          ctx.beginPath();
          box.forEach((p, i) => (i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1])));
          ctx.closePath();
          ctx.stroke();
        });
      };

      runPaddleBtn.addEventListener('click', async () => {
        if (!currentDataUrl) return;
        runPaddleBtn.disabled = true;
        const status = document.getElementById('paddleStatus');
        const meta = document.getElementById('paddleMeta');
        status.className = 'status';
        status.textContent = '加载模型中（首次较慢）…';
        meta.textContent = '运行中';
        try {
          if (!paddleOcr) throw new Error('PaddleOCR 脚本未加载');
          const t0 = performance.now();
          await paddleOcr.init();
          const initMs = Math.round(performance.now() - t0);

          const img = new Image();
          img.src = currentDataUrl;
          await new Promise((r, j) => { img.onload = r; img.onerror = j; });

          const t1 = performance.now();
          const res = await paddleOcr.recognize(img);
          const ms = Math.round(performance.now() - t1);

          const lines = Array.isArray(res.text) ? res.text : [String(res.text || '')];
          document.getElementById('paddleText').textContent = lines.join('\n') || '(未识别到文字)';
          meta.textContent = `${lines.length} 行 · ${ms}ms`;
          status.textContent = `模型加载 ${initMs}ms，识别 ${ms}ms`;
          drawBoxes(res.points);
        } catch (e) {
          status.className = 'status err';
          status.textContent = '失败：' + (e && e.message ? e.message : String(e));
          meta.textContent = '出错';
        } finally {
          runPaddleBtn.disabled = false;
        }
      });

      runTessBtn.addEventListener('click', async () => {
        if (!currentDataUrl) return;
        runTessBtn.disabled = true;
        const status = document.getElementById('tessStatus');
        const meta = document.getElementById('tessMeta');
        status.className = 'status';
        status.textContent = '识别中…';
        meta.textContent = '运行中';
        try {
          const t0 = performance.now();
          const { dataUrl } = await preprocessImage(currentDataUrl);
          const result = await recognizeText(dataUrl, (p) => { status.textContent = `识别中… ${p}%`; });
          const ms = Math.round(performance.now() - t0);

          const text = (result.words || []).map((w) => w.text).join('');
          const conf = (result.words || []).length
            ? Math.round((result.words.reduce((s, w) => s + (w.confidence || 0), 0) / result.words.length))
            : 0;
          document.getElementById('tessText').textContent = text || '(未识别到文字)';
          meta.textContent = `${(result.words || []).length} 字 · 置信度 ${conf}%`;
          status.textContent = `耗时 ${ms}ms`;

          const img = previewImg;
          const scaleX = img.naturalWidth / (await preprocessImage(currentDataUrl)).width;
          drawBoxes((result.words || []).map((w) => {
            const b = w.bbox;
            return [
              [b.x0 * scaleX, b.y0 * scaleX],
              [b.x1 * scaleX, b.y0 * scaleX],
              [b.x1 * scaleX, b.y1 * scaleX],
              [b.x0 * scaleX, b.y1 * scaleX]
            ];
          }));
        } catch (e) {
          status.className = 'status err';
          status.textContent = '失败：' + (e && e.message ? e.message : String(e));
          meta.textContent = '出错';
        } finally {
          runTessBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
